# Tic Tap Due website (public sign-up page only — the app code is NOT in this repo).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"
